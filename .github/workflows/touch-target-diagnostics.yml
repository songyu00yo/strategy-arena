name: Pro10 exact committed motion A-B-A
on:
  push:
    branches: [codex/touch-target-diagnostic-334a487]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIAGNOSTIC_COMMIT: 16cea370a28bb7cbb82a89b12e42fa11e0b1371e
      MODEL_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""
      ARENA_BILLING_DATABASE_PATH: ""
      ARENA_WORKER_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 16cea370a28bb7cbb82a89b12e42fa11e0b1371e
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          mkdir -p artifacts test-results
      - name: Build actual final committed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_COMMIT"
          pnpm build 2>&1 | tee artifacts/motion-build.log
      - name: Install Chromium and runner libraries
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee artifacts/motion-browser-install.log
      - name: Stress twenty original natural moving-target clicks without retries
        run: |
          set -euo pipefail
          mkdir -p artifacts/retarget-stress
          pnpm exec playwright test tests/e2e/overlay-continuity.spec.ts --project=chromium --workers=1 --retries=0 --max-failures=0 --repeat-each=10 --grep 'normal interruption: a real click retargets an unfinished handoff' --trace=retain-on-failure 2>&1 | tee artifacts/retarget-stress/run.log
          node --input-type=module -e 'import {readFileSync} from "node:fs"; import {summarizePlaywright} from "./scripts/ci-validation-report.mjs"; const s=summarizePlaywright(JSON.parse(readFileSync("test-results/e2e.json"))); if(s.status!=="passed"||s.testsDiscovered!==20||s.attempts!==20) throw new Error(JSON.stringify(s));'
          cp test-results/e2e.json test-results/e2e.xml artifacts/retarget-stress/
      - name: Run original 135 serial A1 B A2 diagnostics against final checkout
        run: |
          set -euo pipefail
          node scripts/diagnose-motion.mjs --sha "$DIAGNOSTIC_COMMIT" --groups 3 --output artifacts/motion-diagnostics 2>&1 | tee artifacts/motion-diagnostic-run.log
      - name: Preserve actual checkout identities and every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro10-exact-135-${{ env.DIAGNOSTIC_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/e2e.json
            test-results/e2e.xml
            test-results/**/*.zip
            test-results/**/*.png
          retention-days: 14
