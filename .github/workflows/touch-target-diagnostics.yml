name: Pro10 exact committed motion A-B-A
on:
  push:
    branches: [codex/touch-target-diagnostic-334a487]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DIAGNOSTIC_COMMIT: 7f5d1f19b1ab5f2a18ddf5b08fcc25828d8e97dc
      MODEL_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""
      ARENA_BILLING_DATABASE_PATH: ""
      ARENA_WORKER_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f5d1f19b1ab5f2a18ddf5b08fcc25828d8e97dc
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install frozen dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          mkdir -p artifacts test-results
      - name: Build actual final committed source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_COMMIT"
          pnpm build 2>&1 | tee artifacts/motion-build.log
      - name: Install Chromium and runner libraries
        run: |
          set -euo pipefail
          pnpm exec playwright install --with-deps chromium 2>&1 | tee artifacts/motion-browser-install.log
      - name: Run original 135 serial A1 B A2 diagnostics against final checkout
        run: |
          set -euo pipefail
          node scripts/diagnose-motion.mjs --sha "$DIAGNOSTIC_COMMIT" --groups 3 --output artifacts/motion-diagnostics 2>&1 | tee artifacts/motion-diagnostic-run.log
      - name: Preserve actual checkout identities and every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro10-exact-135-${{ env.DIAGNOSTIC_COMMIT }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
