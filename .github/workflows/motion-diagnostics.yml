name: Motion trace diagnostics

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character commit SHA containing the diagnostic runner
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: motion-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""
      ARENA_BILLING_DATABASE_PATH: ""
      ARENA_WORKER_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Validate exact commit input
        env:
          DIAGNOSTIC_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$DIAGNOSTIC_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Install fixed dependencies
        run: |
          set -euo pipefail
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          mkdir -p artifacts
      - name: Build the exact diagnostic commit
        env:
          DIAGNOSTIC_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DIAGNOSTIC_COMMIT"
          pnpm build 2>&1 | tee artifacts/motion-build.log
      - name: Install Chromium and runner libraries
        run: pnpm exec playwright install --with-deps chromium 2>&1 | tee artifacts/motion-browser-install.log
      - name: Run three serial A1 B A2 groups
        env:
          DIAGNOSTIC_COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          node scripts/diagnose-motion.mjs --sha "$DIAGNOSTIC_COMMIT" --groups 3 --output artifacts/motion-diagnostics 2>&1 | tee artifacts/motion-diagnostic-run.log
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-diagnostics-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/motion-diagnostics/
            artifacts/motion-build.log
            artifacts/motion-browser-install.log
            artifacts/motion-diagnostic-run.log
          retention-days: 14
