name: Trusted touch target diagnostics
on:
  push:
    branches: [codex/touch-target-diagnostic-334a487]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODEL_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      OPENAI_API_KEY: ""
      TAVILY_API_KEY: ""
      ARENA_BILLING_DATABASE_PATH: ""
      ARENA_WORKER_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p artifacts test-results
      - name: Build exact diagnostic source
        run: pnpm build 2>&1 | tee artifacts/build.log
      - run: pnpm exec playwright install --with-deps chromium
      - name: Execute ten original five-tap sequences without retries
        run: |
          pnpm exec playwright test tests/e2e/route-entry-motion.spec.ts --project=chromium --workers=1 --retries=0 --max-failures=0 --repeat-each=10 --grep 'rapid touch selection releases its buffer and foreground details preserve the footprint' --trace=retain-on-failure 2>&1 | tee artifacts/touch-target.log
      - name: Preserve every observed target and failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-touch-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 14
