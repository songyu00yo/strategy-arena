name: Validate Strategy Arena
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MODEL_API_KEY: ""
      MODEL_ID: deepseek-flash
      MODEL_BASE_URL: https://api.deepseek.com/beta
      MODEL_STRUCTURED_OUTPUT: strict-tool
      ARENA_DATABASE_PATH: ./test-results/unit.sqlite
      ARENA_SESSION_SECRET: ci-fixture-session-secret-do-not-use-in-production-12345678
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/scan-secrets.mjs
      - run: mkdir -p artifacts test-results
      - run: pnpm typecheck 2>&1 | tee artifacts/typecheck.log
      - run: pnpm lint 2>&1 | tee artifacts/lint.log
      - run: |
          pnpm test 2>&1 | tee artifacts/unit.log
          node --test scripts/*.test.mjs 2>&1 | tee artifacts/release-integrity.log
      - run: node scripts/validate-evals.mjs
      - run: pnpm build 2>&1 | tee artifacts/build.log
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e 2>&1 | tee artifacts/e2e.log
      - name: Package validated build and its evidence
        run: |
          node scripts/package-release.mjs artifacts/strategy-arena-${{ github.sha }}.tar.gz
          node -e "require('fs').writeFileSync('artifacts/checks.json', JSON.stringify({typecheck:'passed',lint:'passed',unit:'passed',build:'passed',e2e:'passed'}))"
          node scripts/release-manifest.mjs --kind ci --checks artifacts/checks.json --artifact artifacts/strategy-arena-${{ github.sha }}.tar.gz --artifact artifacts/typecheck.log --artifact artifacts/lint.log --artifact artifacts/unit.log --artifact artifacts/release-integrity.log --artifact artifacts/build.log --artifact artifacts/e2e.log --artifact test-results/e2e.xml --output artifacts/manifest-${{ github.sha }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
            test-results/*.xml
            test-results/**/*.zip
            test-results/**/*.png
          retention-days: 14
